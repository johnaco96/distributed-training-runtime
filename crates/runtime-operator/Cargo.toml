[package]
name = "runtime-operator"
version = "0.1.0"
edition = "2021"
description = "Kubernetes operator for TrainingRun resources: schedules coordinator-backed distributed training jobs."

[dependencies]
kube = { version = "1", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.25", features = ["v1_32", "schemars"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "runtime-operator"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
