[package]
name = "runtime-storage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = {
    version = "1",
    default-features = false,
    features = ["default-https-client", "rt-tokio"],
    optional = true,
}
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"], optional = true }

[features]
default = []
s3 = [
    "dep:aws-credential-types",
    "dep:aws-sdk-s3",
    "dep:tokio",
]
