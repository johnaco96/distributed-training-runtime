[package]
name = "dtruntime-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dtruntime_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: one binary per platform for every CPython >= 3.11. The buffer
# protocol (bf_getbuffer) joined the limited API in 3.11, and zero-copy
# tensor handoff is this module's whole point. The pure-Python fallback keeps
# the SDK's 3.9 floor; this optional accelerator needs 3.11+.
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py311"] }
runtime-storage = { path = "../runtime-storage", features = ["s3"] }
sha2 = "0.11"
hex = "0.4"
