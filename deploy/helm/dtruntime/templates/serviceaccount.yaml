{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dtruntime.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dtruntime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The coordinator needs no Kubernetes API access — no Role/RoleBinding is
# rendered. (The operator, when enabled, gets its own cluster RBAC.)
automountServiceAccountToken: false
{{- end }}
