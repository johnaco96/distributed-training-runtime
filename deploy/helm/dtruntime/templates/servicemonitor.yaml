{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dtruntime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dtruntime.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dtruntime.coordinator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      # The alert/recording rules key on job="dtruntime-coordinator"; pin it
      # so the rules work regardless of release/Service naming.
      relabelings:
        - targetLabel: job
          replacement: dtruntime-coordinator
{{- end }}
