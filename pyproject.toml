[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtruntime"
version = "0.1.0"
description = "Python SDK for the Distributed Training Runtime: dataset/checkpoint registration, shard loading, and coordinator RPCs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio",
    "protobuf",
    # dtruntime.shard_loader reads/writes .npz shards with numpy.
    "numpy",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools",
    "pytest",
]
minio = [
    "boto3",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
dtruntime = ["py.typed"]
