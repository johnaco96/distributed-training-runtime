[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtruntime"
version = "0.1.0"
description = "Python SDK for the Distributed Training Runtime: dataset/checkpoint registration, shard loading, and coordinator RPCs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio",
    # Runtime must be >= the gencode version embedded in the committed
    # python/dtruntime/generated stubs (see grpcio-tools pin below).
    "protobuf>=6.33.5",
    # dtruntime.shard_loader reads/writes .npz shards with numpy.
    "numpy",
]

[project.optional-dependencies]
dev = [
    # Pinned so regenerated stubs (scripts/generate_python_proto.py) embed a
    # gencode version compatible with the protobuf runtime floor above.
    "grpcio-tools~=1.81",
    "pytest",
]
minio = [
    "boto3",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
dtruntime = ["py.typed"]
