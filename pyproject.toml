[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dtruntime"
version = "0.1.0"
description = "Python SDK for the Distributed Training Runtime: dataset/checkpoint registration, shard loading, and coordinator RPCs."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "distributed-training-runtime maintainers" }]
keywords = ["pytorch", "distributed-training", "machine-learning", "grpc", "coordinator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "grpcio",
    # Runtime must be >= the gencode version embedded in the committed
    # python/dtruntime/generated stubs (see grpcio-tools pin below).
    "protobuf>=6.33.5",
    # dtruntime.data.shard_writer reads/writes .npz shards with numpy.
    "numpy",
]

[project.urls]
Homepage = "https://github.com/johnaco96/distributed-training-runtime"
Repository = "https://github.com/johnaco96/distributed-training-runtime"
Documentation = "https://github.com/johnaco96/distributed-training-runtime/tree/main/docs"
Issues = "https://github.com/johnaco96/distributed-training-runtime/issues"

[project.scripts]
dtruntime-launch = "dtruntime.launch:main"
dtruntime-admin = "dtruntime.admin.cli:main"

[project.optional-dependencies]
dev = [
    # Pinned so regenerated stubs (scripts/generate_python_proto.py) embed a
    # gencode version compatible with the protobuf runtime floor above.
    # grpcio-tools 1.81 requires Python >= 3.10, so it is only pulled in there;
    # the SDK itself (and running the tests) works on 3.9. Stub regeneration is
    # a 3.10+ maintainer task.
    "grpcio-tools~=1.81; python_version >= '3.10'",
    "build",
    "pytest",
    "ruff",
    # Vulnerability scanning for the SDK's dependency tree (also run in CI).
    "pip-audit",
]
# Real-model benchmark demo (demo/run_benchmark.py): ResNet-18 on CIFAR-10.
demo = [
    "torch",
    "torchvision",
]
# Optional dataset formats for dtruntime.data.
parquet = [
    "pyarrow",
]
# boto3 fallback for s3:// checkpoint destinations and shard fetches when the
# Rust runtime-uploader binary is not built (and for the MinIO-gated tests).
s3 = [
    "boto3",
]

[tool.ruff]
# Machine-generated gRPC/protobuf stubs are not held to lint standards.
extend-exclude = ["python/dtruntime/generated"]

[tool.ruff.lint]
# Beyond the defaults (pyflakes + core pycodestyle): "I" sorts and groups
# imports, so import placement is enforced by the linter rather than left to
# reviewers to notice.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Tests import after pytest.importorskip()/sys.path setup by design.
"python/tests/*" = ["E402"]
"benchmarks/*" = ["E402"]

[tool.setuptools.packages.find]
where = ["python"]
# Ship only the SDK package (and its subpackages); never tests/examples/tools.
include = ["dtruntime*"]

[tool.setuptools.package-data]
dtruntime = ["py.typed"]
