name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (with well-known-type includes)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # dtruntime-native (PyO3 extension) is excluded: its build needs a
      # CPython >= 3.11 interpreter and it is exercised by the Python test
      # suite below via scripts/build_native.py instead.
      - name: Clippy
        run: cargo clippy --workspace --exclude dtruntime-native --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --exclude dtruntime-native --all-features

      - name: Storage integration tests (MinIO + Postgres)
        run: |
          set -e
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          docker run -d --name ci-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=dtr -e POSTGRES_USER=dtr -e POSTGRES_DB=dtruntime \
            postgres:16
          # Wait for both to be ready.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 2
          done
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U dtr && break || sleep 2
          done
          docker exec ci-minio sh -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p local/dtruntime-ci"
          cargo test -p runtime-storage --features s3 --test s3_load -- --nocapture
          cargo test -p runtime-checkpoint --features s3 --test s3_minio
          cargo test -p runtime-coordinator --test pg_load -- --nocapture
        env:
          DTRUNTIME_RUN_MINIO_TESTS: "1"
          DTRUNTIME_S3_ENDPOINT_URL: "http://127.0.0.1:9000"
          DTRUNTIME_S3_REGION: "us-east-1"
          DTRUNTIME_S3_BUCKET: "dtruntime-ci"
          DTRUNTIME_S3_ACCESS_KEY_ID: "minioadmin"
          DTRUNTIME_S3_SECRET_ACCESS_KEY: "minioadmin"
          DTRUNTIME_RUN_PG_TESTS: "1"
          DTRUNTIME_PG_URL: "postgres://dtr:dtr@127.0.0.1:5432/dtruntime"

      - name: Build release coordinator (used by Python e2e tests)
        run: cargo build --release -p runtime-coordinator

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parquet,s3]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Audit Python runtime dependencies
        run: python -m pip_audit .

      - name: Python lint
        run: python -m ruff check .

      - name: Build Python distributions
        run: python -m build

      - name: Build Rust accelerator (dtruntime._native)
        run: python scripts/build_native.py

      - name: Python tests
        run: python -m pytest python/tests -q

      - name: Python integration tests (coordinator gRPC + torch.distributed + data)
        run: >
          python -m pytest -q
          python/tests/test_local_integration.py
          python/tests/test_torch_distributed_integration.py
          python/tests/test_data_integration.py
          python/tests/test_tls_integration.py
        env:
          DTRUNTIME_RUN_LOCAL_INTEGRATION: "1"
          DTRUNTIME_RUN_TORCH_INTEGRATION: "1"
