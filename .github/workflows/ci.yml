name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (with well-known-type includes)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release coordinator (used by Python e2e tests)
        run: cargo build --release -p runtime-coordinator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parquet]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Python tests
        run: python -m pytest python/tests -q

      - name: Python integration tests (coordinator gRPC + torch.distributed + data)
        run: >
          python -m pytest -q
          python/tests/test_local_integration.py
          python/tests/test_torch_distributed_integration.py
          python/tests/test_data_integration.py
        env:
          DTRUNTIME_RUN_LOCAL_INTEGRATION: "1"
          DTRUNTIME_RUN_TORCH_INTEGRATION: "1"
