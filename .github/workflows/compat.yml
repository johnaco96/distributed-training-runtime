name: Compatibility matrix

# Cross-platform build + unit tests on Linux, macOS, and Windows, plus a
# container build. Verifies the coordinator and Python SDK build and pass tests
# on all supported host platforms.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Check every supported Python minor on Linux; 3.12 is exercised on
          # all three host platforms by the matrix above.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (cross-platform)
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build coordinator
        run: cargo build -p runtime-coordinator

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install SDK + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python unit tests
        # Cross-platform UNIT portability. torch-dependent tests skip
        # automatically (torch is not installed here) — that is intended, and
        # ci.yml runs the full integration suite on Linux.
        run: python -m pytest python/tests -q

  container-build:
    name: Container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coordinator image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dtruntime:ci
