apiVersion: v1
kind: ConfigMap
metadata:
  name: dtruntime-prometheus-config
  namespace: dtruntime
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: dtruntime-coordinator
        metrics_path: /metrics
        static_configs:
          - targets: ["runtime-coordinator.dtruntime.svc.cluster.local:9090"]
