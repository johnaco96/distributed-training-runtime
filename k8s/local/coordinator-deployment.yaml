apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-coordinator
  namespace: dtruntime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-coordinator
  template:
    metadata:
      labels:
        app: runtime-coordinator
    spec:
      containers:
        - name: coordinator
          image: distributed-training-runtime:local
          imagePullPolicy: IfNotPresent
          args: ["--addr", "0.0.0.0:50051", "--metrics-addr", "0.0.0.0:9090"]
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
