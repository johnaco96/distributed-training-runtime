apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-coordinator-demo
  namespace: __NAMESPACE__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: pytorch-coordinator-demo
    spec:
      restartPolicy: Never
      containers:
        - name: pytorch-demo
          image: __IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /app/python
            - name: DTRUNTIME_TLS_CA_CERT
              value: /etc/dtruntime/tls/ca/ca.crt
            - name: DTRUNTIME_TLS_CLIENT_CERT
              value: /etc/dtruntime/tls/client/tls.crt
            - name: DTRUNTIME_TLS_CLIENT_KEY
              value: /etc/dtruntime/tls/client/tls.key
            - name: DTRUNTIME_AUTH_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: dtruntime-auth
                  key: DTRUNTIME_AUTH_SUBJECT
            - name: DTRUNTIME_AUTH_ROLE
              valueFrom:
                secretKeyRef:
                  name: dtruntime-auth
                  key: DTRUNTIME_AUTH_ROLE
          command: ["python", "python/examples/pytorch_coordinator_train.py"]
          args:
            - "--addr"
            - "runtime-coordinator.dtruntime.svc.cluster.local:50051"
            - "--workers"
            - "__WORKERS__"
            - "--epochs"
            - "__EPOCHS__"
            - "--samples"
            - "__SAMPLES__"
            - "--batch-size"
            - "__BATCH_SIZE__"
            - "--shards"
            - "__SHARDS__"
            - "--out-dir"
            - "/tmp/dtruntime-pytorch-coordinator"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: client-ca
              mountPath: /etc/dtruntime/tls/ca
              readOnly: true
            - name: client-tls
              mountPath: /etc/dtruntime/tls/client
              readOnly: true
      volumes:
        - name: client-ca
          secret:
            secretName: dtruntime-client-ca
            optional: false
        - name: client-tls
          secret:
            secretName: dtruntime-client-tls
            optional: false
