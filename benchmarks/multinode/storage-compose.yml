# Storage host services for the multi-node benchmark.
#
# Run this on the dedicated storage VM (or locally for the dress rehearsal):
#   docker compose -f storage-compose.yml up -d
#
# Exposes:
#   PostgreSQL  :5432  (coordinator metadata, HA advisory lock)
#   MinIO       :9000  (S3-compatible checkpoint artifact store)
#   MinIO UI    :9001
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dtruntime
      POSTGRES_PASSWORD: dtruntime-bench
      POSTGRES_DB: dtruntime
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtruntime"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dtruntime
      MINIO_ROOT_PASSWORD: dtruntime-bench
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: create the checkpoint bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set bench http://minio:9000 dtruntime dtruntime-bench &&
      mc mb --ignore-existing bench/checkpoints &&
      echo 'bucket ready'"

volumes:
  pg-data:
  minio-data:
