# cargo-deny configuration — supply-chain and vulnerability gating for the
# Rust workspace. Run locally with `cargo deny check`; CI runs
# `cargo deny check advisories bans sources` on every PR (see
# .github/workflows/security-scan.yml).

[advisories]
# Fail on any crate with a known RUSTSEC advisory or that has been yanked.
version = 2
yanked = "deny"
# Ignored advisories — ONLY transitive deps with no stable fix available yet,
# each with a justification and a removal trigger. Re-audit and drop these as
# upstream ships fixes (rustls-webpki 0.104 stable; AWS SDK moving off the old
# rustls 0.21 chain).
ignore = [
    # rustls-pemfile is unmaintained (superseded upstream by rustls-pki-types).
    # Transitive via the aws-sdk / tonic TLS stack; PEM parsing only, no known
    # vulnerability. Remove when those deps drop it.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained transitive PEM parser; no fix, no known vuln; tracked" },
    # rustls-webpki name-constraint validation issues. The fix is only in the
    # 0.104 pre-release (0.103.13 is the latest stable; the AWS SDK chain also
    # pulls the older transitive 0.101.x line). Our TLS
    # trust paths (SPIRE/self-signed/cert-manager for mTLS; public CAs for AWS
    # S3) do not rely on attacker-controlled name-constrained CAs, so practical
    # exposure is low. Remove when rustls-webpki 0.104 ships stable.
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki name constraints; no stable fix yet (only 0.104-alpha); low practical exposure; tracked" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki name constraints (wildcard); no stable fix yet; low practical exposure; tracked" },
    # Reachable panic when parsing a malicious CRL. We do not configure CRLs, so
    # this path is not reachable in our deployments. Remove when patched.
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL parse panic; we do not use CRLs so unreachable; no stable fix yet; tracked" },
]

[bans]
# Flag pulling in the same crate at many major versions (bloat / risk surface).
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden for external crates — but
# internal workspace path dependencies (which legitimately carry no version)
# are allowed.
wildcards = "deny"
allow-wildcard-paths = true
allow = []
deny = []

[sources]
# Only crates.io and explicitly allowed git sources are permitted; anything
# else (a random registry or git URL) fails the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# License policy. Enforced locally; CI gates advisories/bans/sources (the
# security-critical checks) so a new-but-acceptable license does not block a
# security PR. Extend `allow` as new permissive licenses are pulled in.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]
